<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vie scolaire — SchoolManager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/print.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        /* La feuille d'appel n'apparaît qu'à l'impression. */
        #feuillePrint { display: none; }
        @media print {
            .screen-only { display: none !important; }
            #feuillePrint { display: block !important; }
        }

        /* Boutons de pointage : un jeu de trois choix par élève. */
        .ptg { display: inline-flex; gap: 6px; }
        .ptg button {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-soft);
            border-radius: 9px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
        }
        .ptg button:hover { border-color: var(--primary); color: var(--primary); }
        .ptg button:disabled { opacity: 0.55; cursor: not-allowed; }

        .ptg button.on-P { background: var(--success-bg); border-color: var(--success); color: var(--success-text); }
        .ptg button.on-R { background: var(--warning-bg); border-color: var(--warning); color: var(--warning-text); }
        .ptg button.on-A { background: var(--danger-bg); border-color: var(--danger); color: var(--danger-text); }
    </style>
</head>

<body data-page="vie-scolaire" data-auth="true">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <div class="backdrop" id="backdrop"></div>

            <main class="content" id="content">
                <div class="page-header no-print">
                    <div>
                        <h2>📋 Vie scolaire</h2>
                        <div class="subtitle">Faites l'appel d'une classe et suivez les absences.</div>
                    </div>
                    <div class="header-actions">
                        <button class="btn" id="btnTousPresents" data-cap="presences.ecrire">✅ Tous présents</button>
                        <button class="btn" id="btnPrint">🖨️ Feuille d'appel</button>
                        <button class="btn btn-primary" id="btnSave" data-cap="presences.ecrire">💾 Enregistrer l'appel</button>
                    </div>
                </div>

                <!-- Filtres : classe + jour -->
                <div class="card card-pad mb-16 no-print">
                    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">
                        <div class="field" style="margin:0">
                            <label>🏫 Classe</label>
                            <select class="select" id="selClasse"></select>
                        </div>
                        <div class="field" style="margin:0">
                            <label>🗓️ Jour de l'appel</label>
                            <input type="date" class="input" id="jourInput">
                        </div>
                        <div class="field" style="margin:0">
                            <label>&nbsp;</label>
                            <button class="btn" id="btnAujourdhui">📅 Revenir à aujourd'hui</button>
                        </div>
                    </div>
                </div>

                <!-- État de l'appel du jour -->
                <div class="no-print" id="noteJour" style="display:none"></div>

                <!-- Compteurs du jour -->
                <div class="cards-grid mb-16 no-print" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))" id="miniCounts"></div>

                <!-- Feuille d'appel (écran) -->
                <div class="table-wrap no-print">
                    <div class="card-head" style="padding:16px 20px 0">
                        <h3 id="titreAppel">Appel</h3>
                    </div>
                    <table class="data">
                        <thead>
                            <tr>
                                <th>Élève</th>
                                <th style="width:130px">Classe</th>
                                <th style="width:150px">Statut enregistré</th>
                                <th style="width:240px;text-align:center">Pointage du jour</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="table-footer">
                        <span id="countLabel"></span>
                    </div>
                </div>

                <!-- Élèves à suivre : assiduité la plus faible -->
                <div class="card card-pad mt-16 no-print" id="carteSuivi">
                    <div class="card-head" style="padding:0;border:none">
                        <h3>👀 Élèves à suivre</h3>
                        <span class="text-sm text-muted">Assiduité la plus faible de l'établissement</span>
                    </div>
                    <div class="mt-16" id="listeSuivi"></div>
                </div>

                <!-- Feuille d'appel (impression) -->
                <div id="feuillePrint"></div>
            </main>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/live.js" data-page-js="vie-scolaire.js"></script>
</body>

</html>
