<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matières — SchoolManager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="subjects" data-auth="true">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <div class="backdrop" id="backdrop"></div>

            <main class="content" id="content">
                <div class="page-header">
                    <div>
                        <h2>📚 Matières</h2>
                        <div class="subtitle">Programmes enseignés au collège et au lycée.</div>
                    </div>
                    <div class="header-actions">
                        <span class="chip-plain">🧮 Coef. <b id="coefTotal"></b></span>
                    </div>
                </div>

                <!-- Compteurs -->
                <div class="cards-grid mb-16" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))" id="miniCounts"></div>

                <!-- Tableau -->
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                            <tr>
                                <th>Matière</th>
                                <th class="text-center">Coef.</th>
                                <th>Enseignant(s)</th>
                                <th>Classes concernées</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/live.js" data-page-js="subjects.js"></script>
</body>

</html>
