<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matières — SchoolManager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="subjects" data-auth="true">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <div class="backdrop" id="backdrop"></div>

            <main class="content" id="content">
                <div class="page-header">
                    <div>
                        <h2>📚 Matières</h2>
                        <div class="subtitle">Programmes enseignés au collège et au lycée.</div>
                    </div>
                    <div class="header-actions">
                        <span class="chip-plain">🧮 Coef. <b id="coefTotal"></b></span>
                        <button class="btn btn-primary" id="btnAddMatiere" data-cap="matieres.ecrire" style="display:none">➕ Ajouter une matière</button>
                    </div>
                </div>

                <!-- Compteurs -->
                <div class="cards-grid mb-16" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))" id="miniCounts"></div>

                <!-- Tableau -->
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                            <tr>
                                <th>Matière</th>
                                <th class="text-center">Coef.</th>
                                <th>Enseignant(s)</th>
                                <th>Classes concernées</th>
                                <th id="thActions" style="text-align:center;display:none">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Modale Ajouter / Modifier une matière -->
    <div class="modal-overlay" id="modalMatiereEdit">
        <div class="modal">
            <div class="modal-head">
                <h3 id="matiereModalTitle">➕ Ajouter une matière</h3>
                <button class="btn-icon" data-close>✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="matiereId">
                <div class="form-grid">
                    <div class="field span-2">
                        <label>Nom de la matière <span class="req">*</span></label>
                        <input class="input" id="matiereNom" placeholder="Ex. Informatique">
                        <div class="field-error" id="errMatiereNom">Le nom de la matière est obligatoire.</div>
                    </div>
                    <div class="field">
                        <label>Coefficient <span class="req">*</span></label>
                        <input class="input" type="number" min="1" max="20" id="matiereCoef" value="1">
                        <div class="field-error" id="errMatiereCoef">Le coefficient doit être un entier entre 1 et 20.</div>
                    </div>
                    <div class="field">
                        <label>Icône (emoji)</label>
                        <input class="input" id="matiereIcone" placeholder="Ex. 💻" maxlength="6">
                    </div>
                    <div class="field">
                        <label>Couleur</label>
                        <select class="select" id="matiereCouleur">
                            <option value="blue">🔵 Bleu</option>
                            <option value="green">🟢 Vert</option>
                            <option value="cyan">🩵 Cyan</option>
                            <option value="orange">🟠 Orange</option>
                            <option value="purple">🟣 Violet</option>
                            <option value="red">🔴 Rouge</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Code auto</label>
                        <input class="input" id="matiereCode" readonly placeholder="Attribué par le serveur (ex. S9)">
                    </div>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn btn-ghost" data-close>Annuler</button>
                <button class="btn btn-primary" id="btnSaveMatiere">💾 Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modale de suppression d'une matière -->
    <div class="modal-overlay" id="modalDelMatiere">
        <div class="modal modal-sm">
            <div class="modal-body" style="padding:28px">
                <div class="confirm-ico">🗑️</div>
                <div class="confirm-title">Supprimer cette matière ?</div>
                <div class="confirm-text" id="delMatiereText">Cette action est irréversible.</div>
            </div>
            <div class="modal-foot">
                <button class="btn btn-ghost" data-close>Annuler</button>
                <button class="btn btn-danger-soft" id="btnConfirmDelMatiere">Supprimer</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/live.js" data-page-js="subjects.js"></script>
</body>

</html>
