<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonces — SchoolManager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%93%A2%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="announcements" data-auth="true">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <div class="backdrop" id="backdrop"></div>

            <main class="content" id="content">
                <div class="page-header">
                    <div>
                        <h2>📢 Annonces</h2>
                        <div class="subtitle">Informations et communications diffusées à la communauté scolaire.</div>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-primary" data-open="modalAnnounce">➕ Publier une annonce</button>
                    </div>
                </div>

                <!-- Liste -->
                <div id="listAnnounces"></div>
            </main>
        </div>
    </div>

    <!-- Modale Publier -->
    <div class="modal-overlay" id="modalAnnounce">
        <div class="modal">
            <div class="modal-head">
                <h3>📢 Publier une annonce</h3>
                <button class="btn-icon" data-close>✕</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="field span-2">
                        <label>Titre <span class="req">*</span></label>
                        <input class="input" id="fTitre" placeholder="Ex. Journée portes ouvertes">
                        <div class="field-error" id="errTitre">Le titre est obligatoire.</div>
                    </div>
                    <div class="field">
                        <label>Catégorie</label>
                        <select class="select" id="fCategorie">
                            <option>Information</option>
                            <option>Réunion</option>
                            <option>Pédagogie</option>
                            <option>Finance</option>
                            <option>Vie scolaire</option>
                            <option>Sport</option>
                            <option>Concours</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>&nbsp;</label>
                        <label class="chip-toggle" id="wrapImportant" style="width:max-content">
                            <input type="checkbox" id="fImportant">
                            <span>🔥 Annonce importante</span>
                        </label>
                    </div>
                    <div class="field span-2">
                        <label>Contenu <span class="req">*</span></label>
                        <textarea class="textarea" id="fContenu" rows="5" placeholder="Rédigez le contenu de l'annonce…"></textarea>
                        <div class="field-error" id="errContenu">Le contenu est obligatoire.</div>
                    </div>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn btn-ghost" data-close>Annuler</button>
                <button class="btn btn-primary" id="btnSaveAnnounce">🚀 Publier</button>
            </div>
        </div>
    </div>

    <!-- Modale de suppression -->
    <div class="modal-overlay" id="modalDel">
        <div class="modal modal-sm">
            <div class="modal-body" style="padding:28px">
                <div class="confirm-ico">🗑️</div>
                <div class="confirm-title">Supprimer cette annonce ?</div>
                <div class="confirm-text" id="delText">Cette action est irréversible.</div>
            </div>
            <div class="modal-foot">
                <button class="btn btn-ghost" data-close>Annuler</button>
                <button class="btn btn-danger-soft" id="btnConfirmDel">Supprimer</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/live.js" data-page-js="announcements.js"></script>
</body>

</html>
