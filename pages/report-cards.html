<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulletins — SchoolManager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/print.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="report-cards" data-auth="true">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <div class="backdrop" id="backdrop"></div>

            <main class="content" id="content">
                <div class="page-header no-print">
                    <div>
                        <h2>📊 Bulletins scolaires</h2>
                        <div class="subtitle">Générez et imprimez le bulletin de chaque élève.</div>
                    </div>
                    <div class="header-actions">
                        <div class="field" style="margin:0;min-width:260px">
                            <select class="select" id="selEleve"></select>
                        </div>
                        <button class="btn btn-primary" id="btnPrint">🖨️ Imprimer / PDF</button>
                    </div>
                </div>

                <!-- Zone imprimable -->
                <div class="print-area">
                    <div class="bulletin" id="bulletin"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/live.js" data-page-js="report-cards.js"></script>
</body>

</html>
