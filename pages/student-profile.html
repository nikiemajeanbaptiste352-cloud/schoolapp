<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche élève — SchoolManager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body data-page="students" data-auth="true">
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <div class="backdrop" id="backdrop"></div>

            <main class="content" id="content">
                <div class="page-header">
                    <div>
                        <h2>👨‍🎓 Fiche élève</h2>
                        <div class="subtitle">Vue détaillée d'un élève : notes, présences, paiements, bulletin et parent.</div>
                    </div>
                    <div class="header-actions">
                        <a class="btn btn-outline" id="btnRetour" href="students.html">← Retour aux élèves</a>
                        <a class="btn btn-primary" id="btnBulletin" href="report-cards.html">📊 Voir le bulletin</a>
                    </div>
                </div>

                <!-- En-tête profil -->
                <div class="profile-head mb-16" id="profileHead"></div>

                <!-- Mini grille d'informations -->
                <div class="info-grid mb-16" id="infoGrid"></div>

                <!-- Onglets -->
                <div class="card">
                    <div class="tabs" id="tabs">
                        <button class="tab active" data-tab="notes">📊 Notes</button>
                        <button class="tab" data-tab="presences">📅 Présences</button>
                        <button class="tab" data-tab="paiements">💰 Paiements</button>
                        <button class="tab" data-tab="bulletins">📄 Bulletins</button>
                        <button class="tab" data-tab="parent">👨‍👩‍👦 Parent</button>
                    </div>
                    <div class="card-pad">
                        <div class="tab-pane active" id="pane-notes"></div>
                        <div class="tab-pane" id="pane-presences"></div>
                        <div class="tab-pane" id="pane-paiements"></div>
                        <div class="tab-pane" id="pane-bulletins"></div>
                        <div class="tab-pane" id="pane-parent"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/live.js" data-page-js="student-profile.js"></script>
</body>

</html>
